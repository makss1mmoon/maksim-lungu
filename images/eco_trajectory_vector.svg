<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F101A"/>
      <stop offset="100%" stop-color="#141624"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glowT" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .step-num { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 10px; font-weight: 800; letter-spacing: 1px; fill: #FF3366; }
    .step-head { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 800; fill: #FFF; }
    .step-txt { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 10px; fill: #8E92A8; }
    .partner-pill { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 10.5px; font-weight: 800; fill: #FFF; }
    .badge-army { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 9.5px; font-weight: 700; fill: #00E676; }
  </style>

  <rect width="600" height="240" rx="16" fill="url(#bgT)" stroke="#232638" stroke-width="1.2"/>

  <!-- Top 3 Progressive Steps -->
  <!-- Step 1: School / College -->
  <g transform="translate(24, 24)">
    <rect width="165" height="108" rx="10" fill="#181A28" stroke="#2B2F44" stroke-width="1"/>
    <rect x="0" y="0" width="165" height="2.5" rx="1" fill="#FF1744"/>
    <g transform="translate(14, 16)">
      <text x="0" y="0" class="step-num">01. СТАРТ В 15–17 ЛЕТ</text>
      <text x="0" y="20" class="step-head">Школа / Колледж</text>
      <text x="0" y="38" class="step-txt">Поступление без ОГЭ/ЕГЭ</text>
      <text x="0" y="52" class="step-txt">по среднему баллу аттестата</text>
      <g transform="translate(0, 64)">
        <rect width="105" height="18" rx="9" fill="#FF1744" fill-opacity="0.15"/>
        <text x="8" y="12" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#FF5252">Первые навыки IT</text>
      </g>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(196, 70)">
    <path d="M0 0 L16 0 M11 -4 L16 0 L11 4" stroke="#7C4DFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2: University -->
  <g transform="translate(218, 24)">
    <rect width="165" height="108" rx="10" fill="#181A28" stroke="#2B2F44" stroke-width="1"/>
    <rect x="0" y="0" width="165" height="2.5" rx="1" fill="#7C4DFF"/>
    <g transform="translate(14, 16)">
      <text x="0" y="0" class="step-num" fill="#7C4DFF">02. БАЗОВЫЕ КАФЕДРЫ</text>
      <text x="0" y="20" class="step-head">Вуз Синергия</text>
      <text x="0" y="38" class="step-txt">Лаборатории партнеров</text>
      <text x="0" y="52" class="step-txt">Целевые контракты и проекты</text>
      <g transform="translate(0, 64)">
        <rect width="125" height="18" rx="9" fill="#00E676" fill-opacity="0.15"/>
        <text x="8" y="12" class="badge-army">Отсрочка от армии ✓</text>
      </g>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(390, 70)">
    <path d="M0 0 L16 0 M11 -4 L16 0 L11 4" stroke="#00E676" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3: Top Company -->
  <g transform="translate(412, 24)">
    <rect width="165" height="108" rx="10" fill="#181A28" stroke="#2B2F44" stroke-width="1"/>
    <rect x="0" y="0" width="165" height="2.5" rx="1" fill="#00E676"/>
    <g transform="translate(14, 16)">
      <text x="0" y="0" class="step-num" fill="#00E676">03. ВЫСОКИЙ ДОХОД</text>
      <text x="0" y="20" class="step-head">Топ-компании</text>
      <text x="0" y="38" class="step-txt">Сбер, VK, Т-Банк, Ozon</text>
      <text x="0" y="52" class="step-txt">Трудовой стаж во время учебы</text>
      <g transform="translate(0, 64)">
        <rect width="118" height="18" rx="9" fill="#00E676" fill-opacity="0.2"/>
        <text x="8" y="12" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" fill="#00E676">Доход 100 000+ ₽</text>
      </g>
    </g>
  </g>

  <!-- Bottom: 650+ Partner Brands Bar -->
  <g transform="translate(24, 148)">
    <rect width="553" height="68" rx="10" fill="#141624" stroke="#232638" stroke-width="1"/>
    
    <text x="18" y="24" font-family="'Outfit', sans-serif" font-size="10.5" font-weight="800" letter-spacing="1.5px" fill="#8E92A8">
      650+ КОМПАНИЙ-ПАРТНЕРОВ ДЛЯ СТАЖИРОВОК И ТРУДОУСТРОЙСТВА
    </text>

    <!-- Partner Logos / Chips -->
    <g transform="translate(18, 36)">
      <!-- Sber -->
      <g transform="translate(0, 0)">
        <rect width="82" height="24" rx="12" fill="#21A038" fill-opacity="0.15" stroke="#21A038" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="4" fill="#21A038"/>
        <text x="24" y="16" class="partner-pill">СБЕР</text>
      </g>
      <!-- VK -->
      <g transform="translate(92, 0)">
        <rect width="68" height="24" rx="12" fill="#0077FF" fill-opacity="0.15" stroke="#0077FF" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="4" fill="#0077FF"/>
        <text x="24" y="16" class="partner-pill">VK</text>
      </g>
      <!-- T-Bank -->
      <g transform="translate(170, 0)">
        <rect width="98" height="24" rx="12" fill="#FFDD2D" fill-opacity="0.15" stroke="#FFDD2D" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="4" fill="#FFDD2D"/>
        <text x="24" y="16" class="partner-pill">Т-БАНК</text>
      </g>
      <!-- Ozon -->
      <g transform="translate(278, 0)">
        <rect width="82" height="24" rx="12" fill="#005BFF" fill-opacity="0.15" stroke="#005BFF" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="4" fill="#005BFF"/>
        <text x="24" y="16" class="partner-pill">OZON</text>
      </g>
      <!-- Rostec -->
      <g transform="translate(370, 0)">
        <rect width="94" height="24" rx="12" fill="#E53935" fill-opacity="0.15" stroke="#E53935" stroke-width="0.8"/>
        <circle cx="12" cy="12" r="4" fill="#E53935"/>
        <text x="24" y="16" class="partner-pill">РОСТЕХ</text>
      </g>
      <!-- More -->
      <g transform="translate(474, 0)">
        <rect width="45" height="24" rx="12" fill="#FFF" fill-opacity="0.08"/>
        <text x="12" y="16" font-family="'Outfit', sans-serif" font-size="10" font-weight="700" fill="#FFF">+645</text>
      </g>
    </g>
  </g>
</svg>
