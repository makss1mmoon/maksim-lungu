<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F101A"/>
      <stop offset="100%" stop-color="#141624"/>
    </linearGradient>
    <linearGradient id="bridgeFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glowFlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .node-title { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 13px; font-weight: 800; fill: #FFF; letter-spacing: 0.5px; }
    .node-sub { font-family: 'Inter', 'Segoe UI', sans-serif; font-size: 10.5px; fill: #8E92A8; }
    .bridge-tag { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 10px; font-weight: 800; fill: #FF3366; letter-spacing: 1px; }
    .tech-pill { font-family: 'Outfit', 'Segoe UI', sans-serif; font-size: 9.5px; font-weight: 700; fill: #FFF; }
  </style>

  <rect width="600" height="240" rx="16" fill="url(#bgS)" stroke="#232638" stroke-width="1.2"/>

  <!-- Left: Academic Base -->
  <g transform="translate(24, 28)">
    <rect width="155" height="184" rx="12" fill="#181A28" stroke="#2B2F44" stroke-width="1"/>
    <!-- Icon / Badge -->
    <rect x="14" y="16" width="34" height="34" rx="8" fill="#FF1744" fill-opacity="0.15" stroke="#FF1744" stroke-width="1"/>
    <!-- Graduation Cap / Book SVG -->
    <path d="M23 34 L31 29 L39 34 L31 39 Z M31 39 L31 43 M26 36 L26 42 C26 43 36 43 36 42 L36 36" stroke="#FF1744" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    
    <text x="14" y="72" class="node-title">АКАДЕМИЯ</text>
    <text x="14" y="90" class="node-sub">Классическая база</text>
    
    <!-- Bullet points -->
    <g transform="translate(14, 112)">
      <circle cx="4" cy="4" r="2.5" fill="#FF5252"/>
      <text x="12" y="7" font-family="'Inter', sans-serif" font-size="10" fill="#9E9EB2">Фундамент знаний</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#FF5252"/>
      <text x="12" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#9E9EB2">Без оторванной теории</text>

      <circle cx="4" cy="44" r="2.5" fill="#00E676"/>
      <text x="12" y="47" font-family="'Inter', sans-serif" font-size="10" fill="#00E676">Старт с 1 курса</text>
    </g>
  </g>

  <!-- Center Bridge: Seamless Accelerator -->
  <g transform="translate(195, 45)">
    <!-- Bridge Glowing Path -->
    <path d="M 0 75 Q 105 10 210 75" fill="none" stroke="url(#bridgeFlow)" stroke-width="4" filter="url(#glowFlow)"/>
    <path d="M 0 75 Q 105 10 210 75" fill="none" stroke="#FFF" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Central Tech Hub Badge -->
    <g transform="translate(45, 10)">
      <rect width="120" height="28" rx="14" fill="#121320" stroke="#7C4DFF" stroke-width="1.5"/>
      <text x="15" y="18" class="bridge-tag">БЕСШОВНЫЙ МОСТ</text>
    </g>

    <!-- Floating Tech Badges -->
    <g transform="translate(15, 95)">
      <rect width="52" height="20" rx="10" fill="#7C4DFF" fill-opacity="0.25" stroke="#7C4DFF" stroke-width="0.8"/>
      <text x="10" y="14" class="tech-pill">React</text>
    </g>
    <g transform="translate(80, 95)">
      <rect width="56" height="20" rx="10" fill="#00B0FF" fill-opacity="0.25" stroke="#00B0FF" stroke-width="0.8"/>
      <text x="9" y="14" class="tech-pill">Python</text>
    </g>
    <g transform="translate(148, 95)">
      <rect width="48" height="20" rx="10" fill="#00E676" fill-opacity="0.25" stroke="#00E676" stroke-width="0.8"/>
      <text x="9" y="14" class="tech-pill">Agile</text>
    </g>

    <!-- Subtitle badge below -->
    <text x="42" y="138" font-family="'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#00E676">ПРАКТИКА С 1 КУРСА ⚡</text>
  </g>

  <!-- Right: IT &amp; Top Business -->
  <g transform="translate(421, 28)">
    <rect width="155" height="184" rx="12" fill="#181A28" stroke="#2B2F44" stroke-width="1"/>
    <rect x="14" y="16" width="34" height="34" rx="8" fill="#00E676" fill-opacity="0.15" stroke="#00E676" stroke-width="1"/>
    <!-- Laptop / Rocket SVG -->
    <path d="M22 38 L40 38 M25 28 L37 28 L37 36 L25 36 Z" stroke="#00E676" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    
    <text x="14" y="72" class="node-title">ИНДУСТРИЯ</text>
    <text x="14" y="90" class="node-sub">Топ-IT и Корпорации</text>

    <!-- Bullet points -->
    <g transform="translate(14, 112)">
      <circle cx="4" cy="4" r="2.5" fill="#00E676"/>
      <text x="12" y="7" font-family="'Inter', sans-serif" font-size="10" fill="#00E676">Оффер в резюме</text>
      
      <circle cx="4" cy="24" r="2.5" fill="#00E676"/>
      <text x="12" y="27" font-family="'Inter', sans-serif" font-size="10" fill="#00E676">Свой работающий софт</text>

      <circle cx="4" cy="44" r="2.5" fill="#00E676"/>
      <text x="12" y="47" font-family="'Inter', sans-serif" font-size="10" fill="#00E676">Высокий доход</text>
    </g>
  </g>
</svg>
